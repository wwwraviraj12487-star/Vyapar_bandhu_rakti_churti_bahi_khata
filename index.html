<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#138808">
<style>
body { font-family: 'Mangal', Arial; background: #f5f5f5; margin: 0; padding: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 10px; text-align: center; border-bottom: 4px solid #000080; }
.gov-board h1 { margin: 0; font-size: 16px; color: #000080; font-weight: bold; }
.today-date { background: #000080; color:#fff; padding:8px; text-align:center; font-weight:bold; }
.loading { font-size:12px; color:#ff9800; }
.search-box { background: #fff; padding: 10px; margin: 10px; border-radius: 10px; border: 2px solid #138808; }
.search-box input { width: 100%; padding: 10px; border: 2px solid #ff9800; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 10px; border: 2px solid #ff9800; }
input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 2px solid #138808; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
.btn-main { width: 100%; padding: 12px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
.khata-list { margin: 10px; }
.khata-card { background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #d32f2f; box-shadow: 0 2px 4px #ccc; }
.khata-card img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px; margin: 8px 0; border: 1px solid #ddd; }
.hindi-date { color:#138808; font-weight:bold; font-size:13px; }
.row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn-speak { flex:1; background: #ff6600; color:#fff; border:none; padding:8px; border-radius:6px; font-size:12px; }
.btn-print { flex:1; background: #000080; color:#fff; border:none; padding:8px; border-radius:6px; font-size:12px; }
.delete { background: #d32f2f; }
.churti { background: #2e7d32; }
</style>
</head>
<body>

<div class="gov-board">
  <h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
  <p>Made in Bihar | पंचांग API | 12 महीना बाद चक्रवृद्धि</p>
</div>
<div class="today-date" id="todayHindiDate">लोड हो रहा है... <span class="loading">⏳</span></div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()">
</div>

<div class="calc-box">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label>
  <input type="text" id="custName">

  <label>पता</label>
  <textarea id="custAddress" rows="2"></textarea>

  <label>सामान का नाम</label>
  <input type="text" id="samanName">

  <label>सामान का फोटो</label>
  <input type="file" id="samanPhoto" accept="image/*">

  <label>उधार की तारीख</label>
  <input type="date" id="udharDate">
  <div class="hindi-date" id="hindiDatePreview">हिंदी तारीख लोड हो रही है...</div>

  <label>मूलधन ₹</label>
  <input type="number" id="mulDhan">

  <label>ब्याज दर % महीना</label>
  <input type="number" id="byajRate" value="2" step="0.1">

  <button class="btn-main" onclick="khataAdd()">खाता जोड़ें</button>
</div>

<div class="khata-list" id="khataList"></div>

<script>
const PATNA_LAT = 25.5941; // पटना का Latitude
const PATNA_LON = 85.1376; // पटना का Longitude
const TIMEZONE = "Asia/Kolkata";

let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

// DrikPanchang API से 100% शुद्ध तारीख निकालना
async function getPanchangDate(gDate){
    let d = new Date(gDate);
    let year = d.getFullYear();
    let month = d.getMonth() + 1;
    let day = d.getDate();
    
    try{
        let url = `https://api.panchang.net/api/panchang?year=${year}&month=${month}&day=${day}&latitude=${PATNA_LAT}&longitude=${PATNA_LON}&timezone=${TIMEZONE}`;
        let res = await fetch(url);
        let data = await res.json();
        
        let tithi = data.tithi.name + " " + data.tithi.paksha; // सुदी पंचमी / बदी एकादशी
        let monthName = data.hindu_month.name; // सावन, अधिक सावन
        let yearVS = data.hindu_year; // 2083
        let weekday = data.weekday; // गुरुवार
        
        return `${day} ${monthName} ${yearVS}, ${tithi}, ${weekday}`;
    } catch(e){
        return "तारीख लोड नहीं हुई";
    }
}

async function updateTodayDate(){
    document.getElementById('todayHindiDate').innerText = "आज: " + await getPanchangDate(new Date());
}
updateTodayDate();

document.getElementById('udharDate').addEventListener('change', async function(){
    document.getElementById('hindiDatePreview').innerText = "हिंदी तारीख: " + await getPanchangDate(this.value);
})

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  getPanchangDate(new Date()).then(d => {
    document.getElementById('hindiDatePreview').innerText = "हिंदी तारीख: " + d;
  });
  showKhata();
}

function khataAdd(){
  let name = document.getElementById('custName').value;
  let address = document.getElementById('custAddress').value;
  let saman = document.getElementById('samanName').value;
  let date = document.getElementById('udharDate').value;
  let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value);
  let photoFile = document.getElementById('samanPhoto').files[0];

  if(!name ||!saman ||!date ||!mul){ alert("सब भरना जरूरी है"); return; }

  getPanchangDate(date).then(hindiDate => {
    if(photoFile){
      let reader = new FileReader();
      reader.onload = function(e){
        saveKhata(name, address, saman, date, hindiDate, mul, rate, e.target.result);
      }
      reader.readAsDataURL(photoFile);
    } else {
      saveKhata(name, address, saman, date, hindiDate, mul, rate, "");
    }
  });
}

function saveKhata(name, address, saman, date, hindiDate, mul, rate, photo){
  khataData.push({id: Date.now(), name, address, saman, date, hindiDate, mul, rate, photo});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  alert("खाता सेव हो गया");
  location.reload();
}

// बाकी hisabNikalo, showKhata, print, speak वाला फंक्शन वही रहेगा जो पहले था
// बस showKhata में ये लाइन जोड़ना: <div class="row hindi-date"><span>हिंदी तारीख:</span><span>${k.hindiDate}</span></div>

function hisabNikalo(khata){
  let startDate = new Date(khata.date);
  let today = new Date();
  let diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44;
  let currentAmount = khata.mul;
  let totalInterest = 0;

  if(diffMonths <= 12){
    totalInterest = (khata.mul * khata.rate * diffMonths) / 100;
    currentAmount = khata.mul + totalInterest;
  } else {
    let firstYearInterest = (khata.mul * khata.rate * 12) / 100;
    currentAmount = khata.mul + firstYearInterest;
    let remainingMonths = diffMonths - 12;
    for(let i=0; i<remainingMonths; i++){
      currentAmount = currentAmount + (currentAmount * khata.rate) / 100;
    }
    totalInterest = currentAmount - khata.mul;
  }
  return {months: diffMonths.toFixed(1), interest: totalInterest, total: currentAmount};
}

function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center; color:#138808;'>📑 सभी खाते</h2>";
  data.forEach(k => {
    let hisab = hisabNikalo(k);
    let photoHtml = k.photo? `<img src="${k.photo}">` : "";
    list.innerHTML += `
    <div class="khata-card">
      <h3>${k.name}</h3>
      <div class="row"><span>पता:</span><span>${k.address}</span></div>
      <div class="row"><span>सामान:</span><span>${k.saman}</span></div>
      ${photoHtml}
      <div class="row"><span>अंग्रेजी:</span><span>${k.date}</span></div>
      <div class="row hindi-date"><span>हिंदी:</span><span>${k.hindiDate}</span></div>
      <div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div>
      <div class="row total"><span>कुल देना:</span><span>₹${hisab.total.toFixed(2)}</span></div>
    </div>`;
  });
}
</script>
</body>
</html>
