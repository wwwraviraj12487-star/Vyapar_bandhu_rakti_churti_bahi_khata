<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu</title>
<style>
body { font-family: Arial; background: #f0f8ff; padding: 10px; }
.calc-box { background: #fff; padding: 15px; border-radius: 10px; border: 2px solid green; margin-bottom: 10px; }
input, button { width: 100%; padding: 12px; margin: 5px 0; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; }
button { background: green; color: white; font-weight: bold; border: none; }
.khata-card { background: #fff; padding: 10px; margin: 10px 0; border-left: 5px solid red; border-radius: 8px; }
.khata-card img { width: 80px; height: 80px; float: right; border-radius: 5px; border: 1px solid green; }
.row { display: flex; justify-content: space-between; font-size: 13px; }
.total { color: red; font-weight: bold; font-size: 16px; }
.btn-small { width: 32%; padding: 8px; font-size: 12px; margin-top: 5px; }
</style>
</head>
<body>

<h2 style="text-align:center; color:navy;">Vyapar Bandhu</h2>
<div id="todayDate" style="text-align:center; background:navy; color:white; padding:8px;"></div>

<div class="calc-box">
  <h3>📒 नया खाता</h3>
  <input type="text" id="custName" placeholder="ग्राहक का नाम">
  <input type="text" id="samanName" placeholder="सामान का नाम">
  <input type="number" id="samanGram" placeholder="ग्राम">
  <input type="text" id="samanLocation" placeholder="कहां रखा है">
  <input type="file" id="samanPhoto" accept="image/*">
  <input type="date" id="udharDate">
  <input type="number" id="mulDhan" placeholder="मूलधन ₹">
  <input type="number" id="byajRate" value="2" placeholder="ब्याज %">
  <button onclick="khataAdd()">खाता जोड़ें</button>
  <button onclick="window.print()" style="background:navy;">📄 प्रिंट</button>
</div>

<div id="khataList"></div>

<script>
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];
document.getElementById('udharDate').valueAsDate = new Date();
document.getElementById('todayDate').innerText = "आज: " + new Date().toLocaleDateString('hi-IN');
showKhata();

function khataAdd(){
  let name = custName.value; let saman = samanName.value; let date = udharDate.value; let mul = parseFloat(mulDhan.value);
  if(!name ||!saman ||!date ||!mul){ alert("सब भरना जरूरी है"); return; }
  let photoFile = samanPhoto.files[0];
  if(photoFile){
    let reader = new FileReader();
    reader.onload = e => { save(name, saman, samanGram.value, samanLocation.value, date, mul, byajRate.value, e.target.result); }
    reader.readAsDataURL(photoFile);
  } else { save(name, saman, samanGram.value, samanLocation.value, date, mul, byajRate.value, ""); }
}

function save(n,s,g,l,d,m,r,p){
  khataData.push({id:Date.now(), name:n, saman:s, gram:g, location:l, date:d, mul:m, rate:r, photo:p, payment:[]});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  alert("सेव हो गया");
  document.querySelectorAll('input').forEach(i=>i.value="");
  udharDate.valueAsDate = new Date();
  showKhata();
}

function hisab(k){
  let days = Math.floor((new Date() - new Date(k.date))/86400000);
  let months = days/30.44;
  let interest = (k.mul * k.rate * months)/100;
  let total = k.mul + interest;
  let paid = k.payment.reduce((a,b)=>a+b,0);
  return {total:total-paid, months:months.toFixed(1), days:days, interest:interest, paid:paid};
}

function showKhata(){
  let html = "<h3>📑 सभी खाते</h3>";
  khataData.forEach(k=>{
    let h = hisab(k);
    html += `<div class="khata-card">
      <h4>${k.name} ${k.photo?`<img src="${k.photo}">`:''}</h4>
      <div class="row"><span>सामान:</span><span>${k.saman} ${k.gram}g</span></div>
      <div class="row"><span>कहां:</span><span>${k.location}</span></div>
      <div class="row"><span>समय:</span><span>${h.months} महीना</span></div>
      <div class="row"><span>ब्याज:</span><span>₹${h.interest.toFixed(0)}</span></div>
      <div class="row total"><span>बकाया:</span><span>₹${h.total.toFixed(0)}</span></div>
      <button class="btn-small" onclick="bol(${k.id})">🔊</button>
      <button class="btn-small" style="background:blue" onclick="jama(${k.id})">💰जमा</button>
      <button class="btn-small" style="background:gray" onclick="del(${k.id})">🗑️</button>
    </div>`;
  });
  khataList.innerHTML = html;
}

function bol(id){ let k = khataData.find(x=>x.id==id); let h=hisab(k); speechSynthesis.speak(new SpeechSynthesisUtterance(`${k.name} का बकाया ${Math.round(h.total)} रुपया`)); }
function jama(id){ let amt = prompt("कितना जमा?"); if(amt>0){ khataData.find(x=>x.id==id).payment.push(parseFloat(amt)); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); } }
function del(id){ if(confirm("Delete?")){ khataData = khataData.filter(x=>x.id!=id); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); } }
</script>
</body>
</html>
