<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>
<style>
body { font-family: 'Mangal', Arial; background: #f5f5f5; margin: 0; padding: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 12px; text-align: center; border-bottom: 4px solid #000080; }
.gov-board h1 { margin: 0; font-size: 18px; color: #000080; font-weight: bold; }
.gov-board p { margin: 4px 0 0 0; font-size: 12px; color: #000; }
.today-date { background: #000080; color:#fff; padding:10px; text-align:center; font-weight:bold; font-size:15px; }
.search-box { background: #fff; padding: 12px; margin: 10px; border-radius: 12px; border: 2px solid #138808; }
.search-box input { width: 100%; padding: 12px; border: 2px solid #ff9800; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 12px; border: 2px solid #ff9800; box-shadow: 0 2px 5px #ccc; }
.calc-box h2 { margin-top: 0; color: #000080; }
label { font-weight: bold; font-size: 14px; }
input, textarea { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 2px solid #138808; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
.btn-main { width: 100%; padding: 14px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
.btn-print { background: #000080; }
.khata-list { margin: 10px; }
.khata-card { background: #fff; padding: 12px; margin-bottom: 12px; border-radius: 10px; border-left: 6px solid #d32f2f; box-shadow: 0 2px 4px #ccc; }
.khata-card img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px; margin: 8px 0; border: 1px solid #ddd; }
.row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; }
.btn-small { padding: 6px 10px; font-size: 12px; border: none; border-radius: 6px; cursor: pointer; margin-right: 5px; }
.btn-speak { background: #ff9800; color: #fff; }
.btn-print-one { background: #138808; color: #fff; }

@media print {
  body * { visibility: hidden; }
  #printArea, #printArea * { visibility: visible; }
  #printArea { position: absolute; left: 0; top: 0; width: 100%; }
.no-print { display: none; }
}
</style>
</head>
<body>

<div class="gov-board">
  <h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
  <p>Made in Bihar | 12 महीना बाद चक्रवृद्धि</p>
</div>
<div class="today-date" id="todayDate">लोड हो रहा है... ⏳</div>

<div class="search-box no-print">
  <input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()">
</div>

<div class="calc-box no-print">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label>
  <input type="text" id="custName" placeholder="जैसे: राम कुमार">

  <label>पता</label>
  <textarea id="custAddress" rows="2" placeholder="गांव, थाना, जिला"></textarea>

  <label>सामान का नाम</label>
  <input type="text" id="samanName" placeholder="जैसे: 2 बोरी खाद">

  <label>सामान का फोटो</label>
  <input type="file" id="samanPhoto" accept="image/*">

  <label>उधार की तारीख</label>
  <input type="date" id="udharDate">
  <div class="loading" id="datePreview">तारीख: </div>

  <label>मूलधन ₹</label>
  <input type="number" id="mulDhan" placeholder="5000">

  <label>ब्याज दर % महीना</label>
  <input type="number" id="byajRate" value="2" step="0.1">

  <button class="btn-main" onclick="khataAdd()">खाता जोड़ें</button>
  <button class="btn-main btn-print" onclick="printAll()">📄 पूरा हिसाब प्रिंट करें</button>
</div>

<div class="khata-list" id="khataList"></div>

<div id="printArea" style="display:none;"></div>

<script>
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

function getDateString(gDate){
    let d = new Date(gDate);
    let options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' };
    return d.toLocaleDateString('hi-IN', options);
}

function updateTodayDate(){
    document.getElementById('todayDate').innerText = "आज: " + getDateString(new Date());
}
updateTodayDate();

document.getElementById('udharDate').addEventListener('change', function(){
    document.getElementById('datePreview').innerText = "तारीख: " + getDateString(this.value);
})

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  document.getElementById('datePreview').innerText = "तारीख: " + getDateString(new Date());
  showKhata();
}

function khataAdd(){
  let name = document.getElementById('custName').value;
  let address = document.getElementById('custAddress').value;
  let saman = document.getElementById('samanName').value;
  let date = document.getElementById('udharDate').value;
  let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value);
  let photoFile = document.getElementById('samanPhoto').files[0];

  if(!name ||!saman ||!date ||!mul){ alert("सब भरना जरूरी है"); return; }

  let engDate = getDateString(date);

  if(photoFile){
    let reader = new FileReader();
    reader.onload = function(e){
      saveKhata(name, address, saman, date, engDate, mul, rate, e.target.result);
    }
    reader.readAsDataURL(photoFile);
  } else {
    saveKhata(name, address, saman, date, engDate, mul, rate, "");
  }
}

function saveKhata(name, address, saman, date, engDate, mul, rate, photo){
  khataData.push({id: Date.now(), name, address, saman, date, engDate, mul, rate, photo});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  alert("खाता सेव हो गया ✅");
  document.getElementById('custName').value = "";
  document.getElementById('custAddress').value = "";
  document.getElementById('samanName').value = "";
  document.getElementById('mulDhan').value = "";
  document.getElementById('samanPhoto').value = "";
  showKhata();
}

function hisabNikalo(khata){
  let startDate = new Date(khata.date);
  let today = new Date();
  let diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44;
  let currentAmount = khata.mul;

  if(diffMonths <= 12){
    currentAmount = khata.mul + (khata.mul * khata.rate * diffMonths) / 100;
  } else {
    let firstYear = khata.mul + (khata.mul * khata.rate * 12) / 100;
    let remainingMonths = diffMonths - 12;
    currentAmount = firstYear;
    for(let i=0; i<remainingMonths; i++){
      currentAmount = currentAmount + (currentAmount * khata.rate) / 100;
    }
  }
  return {total: currentAmount, months: diffMonths.toFixed(1)};
}

// 1. बोलने वाला फीचर - सामान जोड़ दिया
function bolKeBatao(khata){
  let hisab = hisabNikalo(khata);
  let text = `${khata.name} जी का हिसाब।
  सामान है ${khata.saman}।
  मूलधन ${khata.mul} रुपया।
  ${hisab.months} महीना हुआ है।
  ब्याज दर ${khata.rate} प्रतिशत।
  कुल देना है ${Math.round(hisab.total)} रुपया।`;

  let speech = new SpeechSynthesisUtterance(text);
  speech.lang = 'hi-IN';
  speech.rate = 0.9;
  window.speechSynthesis.speak(speech);
}

// 2. एक खाते का प्रिंट
function printOne(id){
  let k = khataData.find(x => x.id == id);
  let hisab = hisabNikalo(k);
  let printHtml = `
  <h2 style="text-align:center;">Vyapar Bandhu - खाता पर्ची</h2>
  <hr>
  <p><b>नाम:</b> ${k.name}</p>
  <p><b>पता:</b> ${k.address || 'नहीं दिया'}</p>
  <p><b>सामान:</b> ${k.saman}</p>
  <p><b>तारीख:</b> ${k.engDate || k.date}</p>
  <p><b>मूलधन:</b> ₹${k.mul.toFixed(2)}</p>
  <p><b>समय:</b> ${hisab.months} महीना</p>
  <p><b>ब्याज दर:</b> ${k.rate}% महीना</p>
  <hr>
  <h3><b>कुल देना:</b> ₹${hisab.total.toFixed(2)}</h3>
  `;
  document.getElementById('printArea').innerHTML = printHtml;
  document.getElementById('printArea').style.display = 'block';
  window.print();
  document.getElementById('printArea').style.display = 'none';
}

// 3. पूरा हिसाब प्रिंट
function printAll(){
  let printHtml = `<h2 style="text-align:center;">Vyapar Bandhu - पूरा बही खाता</h2><hr>`;
  khataData.forEach(k => {
    let hisab = hisabNikalo(k);
    printHtml += `
    <div style="border:1px solid #000; padding:8px; margin:8px 0;">
      <p><b>${k.name}</b> | ${k.address || ''}</p>
      <p>सामान: ${k.saman} | तारीख: ${k.engDate || k.date}</p>
      <p>मूलधन: ₹${k.mul.toFixed(2)} | कुल देना: ₹${hisab.total.toFixed(2)}</p>
    </div>`;
  });
  document.getElementById('printArea').innerHTML = printHtml;
  document.getElementById('printArea').style.display = 'block';
  window.print();
  document.getElementById('printArea').style.display = 'none';
}

function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center; color:#138808;'>📑 सभी खाते</h2>";
  if(data.length === 0){
    list.innerHTML += "<p style='text-align:center;'>अभी कोई खाता नहीं है</p>";
    return;
  }
  data.forEach(k => {
    let hisab = hisabNikalo(k);
    let photoHtml = k.photo? `<img src="${k.photo}">` : "";
    list.innerHTML += `
    <div class="khata-card">
      <h3>${k.name}</h3>
      <div class="row"><span>पता:</span><span>${k.address || 'नहीं दिया'}</span></div>
      <div class="row"><span>सामान:</span><span>${k.saman}</span></div>
      ${photoHtml}
      <div class="row"><span>तारीख:</span><span>${k.engDate || k.date}</span></div>
      <div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div>
      <div class="row"><span>समय:</span><span>${hisab.months} महीना</span></div>
      <div class="row total"><span>कुल देना:</span><span>₹${hisab.total.toFixed(2)}</span></div>
      <div class="no-print" style="margin-top:8px;">
        <button class="btn-small btn-speak" onclick="bolKeBatao(khataData.find(x=>x.id==${k.id}))">🔊 बोलो</button>
        <button class="btn-small btn-print-one" onclick="printOne(${k.id})">🖨️ प्रिंट</button>
      </div>
    </div>`;
  });
}

function searchKhata(){
  let query = document.getElementById('searchInput').value.toLowerCase();
  let filtered = khataData.filter(k =>
    k.name.toLowerCase().includes(query) ||
    k.address.toLowerCase().includes(query)
  );
  showKhata(filtered);
}
</script>
</body>
</html>
