<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>
<style>
body { font-family: 'Mangal', Arial; background: #f0f8ff; margin: 0; padding: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 12px; text-align: center; border-bottom: 4px solid #000080; }
.today-date { background: #000080; color:#fff; padding:10px; text-align:center; font-weight:bold; }
.search-box { background: #fff; padding: 12px; margin: 10px; border-radius: 12px; border: 2px solid #138808; }
.search-box input { width: 100%; padding: 12px; border: 2px solid #ff9800; border-radius: 8px; box-sizing: border-box; }
.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 12px; border: 2px solid #ff9800; }
.btn-main { width: 100%; padding: 14px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
.khata-card { background: #fff; padding: 12px; margin: 10px; border-radius: 10px; border-left: 6px solid #d32f2f; box-shadow: 0 3px 6px #bbb; }
.khata-card h3 { margin: 0 0 8px 0; color: #000080; }

/* 🔥 AB PAKKA CHHOTA */
.khata-card img {
  width: auto;
  max-width: 180px; /* कार्ड की आधी चौड़ाई */
  height: 120px; /* फिक्स हाइट */
  object-fit: cover; /* क्रॉप हो जाएगा लेकिन साफ दिखेगा */
  border-radius: 6px;
  margin: 8px 0;
  border: 2px solid #138808;
  float: right; /* दाहिने साइड में लग जाएगा */
  margin-left: 10px;
}

.row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eee; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; border-bottom: none; }
.danger { font-weight: bold; color: #fff; background: #d32f2f; padding: 4px; border-radius: 4px; text-align: center; clear: both; /* फोटो के नीचे आ जाए */ }
.btn-small { padding: 7px 8px; font-size: 11px; border: none; border-radius: 6px; margin-right: 4px; font-weight: bold; color:#fff; }
.btn-speak { background: #ff9800; }
.btn-payment { background: #007bff; }
.btn-delete { background: #555; }
.payment-log { background:#e8f5e9; padding:5px; border-radius:5px; margin-top:5px; font-size:12px; clear: both; }
.secret { color: #d32f2f; font-weight: bold; }
input, textarea { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 2px solid #138808; border-radius: 6px; box-sizing: border-box; }
</style>
</head>
<body>

<div class="gov-board">
  <h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
  <p>Made in Bihar | 12 महीना बाद चक्रवृद्धि</p>
</div>
<div class="today-date" id="todayDate">आज: </div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()">
</div>

<div class="calc-box">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label><input type="text" id="custName">
  <label>ग्राहक का Gmail</label><input type="email" id="custEmail">
  <label>पता</label><textarea id="custAddress" rows="2"></textarea>
  <label>सामान का नाम</label><input type="text" id="samanName">
  <label>सामान कितना ग्राम</label><input type="number" id="samanGram">
  <label>सामान कहां रखा है</label><input type="text" id="samanLocation">
  <label>सामान कितने दिन की करारी है</label><input type="number" id="karariDin">
  <label>सामान का फोटो</label><input type="file" id="samanPhoto" accept="image/*">
  <label>उधार की तारीख</label><input type="date" id="udharDate">
  <label>मूलधन ₹</label><input type="number" id="mulDhan">
  <label>ब्याज दर % महीना</label><input type="number" id="byajRate" value="2" step="0.1">
  <button class="btn-main" id="btnAdd">खाता जोड़ें</button>
  <button class="btn-main" style="background:#000080" id="btnPrint">📄 पूरा हिसाब प्रिंट करें</button>
</div>

<div id="khataList"></div>

<script>
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  updateTodayDate();
  showKhata();
  document.getElementById('btnAdd').onclick = khataAdd;
  document.getElementById('btnPrint').onclick = printAll;
}

function getDateString(gDate){ return new Date(gDate).toLocaleDateString('hi-IN'); }
function updateTodayDate(){ document.getElementById('todayDate').innerText = "आज: " + getDateString(new Date()); }

function khataAdd(){
  let name = document.getElementById('custName').value; let email = document.getElementById('custEmail').value; let address = document.getElementById('custAddress').value;
  let saman = document.getElementById('samanName').value; let gram = document.getElementById('samanGram').value; let location = document.getElementById('samanLocation').value;
  let karari = document.getElementById('karariDin').value; let date = document.getElementById('udharDate').value; let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value); let photoFile = document.getElementById('samanPhoto').files[0];
  if(!name ||!saman ||!date ||!mul){ alert("नाम, सामान, तारीख, मूलधन भरना जरूरी है"); return; }
  if(photoFile){ let reader = new FileReader(); reader.onload = function(e){ saveKhata(name, email, address, saman, gram, location, karari, date, mul, rate, e.target.result); } reader.readAsDataURL(photoFile); }
  else { saveKhata(name, email, address, saman, gram, location, karari, date, mul, rate, ""); }
}

function saveKhata(name, email, address, saman, gram, location, karari, date, mul, rate, photo){
  khataData.push({id: Date.now(), name, email, address, saman, gram, location, karari, date, mul, rate, photo, paymentHistory: []});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); alert("खाता सेव हो गया ✅");
  document.querySelectorAll('.calc-box input,.calc-box textarea').forEach(el => el.value = ""); document.getElementById('udharDate').valueAsDate = new Date(); showKhata();
}

function hisabNikalo(khata){
  let diffDays = Math.floor((new Date() - new Date(khata.date)) / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44; let currentAmount = khata.mul; let totalInterest = 0;
  if(diffMonths <= 12){ totalInterest = (khata.mul * khata.rate * diffMonths) / 100; currentAmount = khata.mul + totalInterest; }
  else { let firstYear = khata.mul + (khata.mul * khata.rate * 12) / 100; let remainingMonths = diffMonths - 12; currentAmount = firstYear; for(let i=0; i<remainingMonths; i++){ currentAmount = currentAmount + (currentAmount * khata.rate) / 100; } totalInterest = currentAmount - khata.mul; }
  let totalPaid = 0; if(khata.paymentHistory){ khata.paymentHistory.forEach(p => { totalPaid += p.amount; }) }
  currentAmount = currentAmount - totalPaid; if(currentAmount < 0) currentAmount = 0;
  let karariStatus = ""; if(khata.karari){ if(diffDays > parseInt(khata.karari)){ karariStatus = "⚠️ करारी खत्म! सामान टूट जाएगा"; } else { karariStatus = `करारी बाकी: ${parseInt(khata.karari) - diffDays} दिन`; } }
  return {total: currentAmount, months: diffMonths.toFixed(1), days: diffDays, karariStatus: karariStatus, totalPaid: totalPaid, interest: totalInterest};
}

function bolKeBatao(khata){ let h = hisabNikalo(khata); let text = `${khata.name} जी। सामान है ${khata.saman} ${khata.gram? khata.gram + ' ग्राम' : ''}। सामान रखा है ${khata.location || 'पता नहीं'}। ${h.months} महीना हुआ। बकाया ${Math.round(h.total)} रुपया।`; let speech = new SpeechSynthesisUtterance(text); speech.lang = 'hi-IN'; window.speechSynthesis.speak(speech); }

function addPayment(id){ let k = khataData.find(x => x.id == id); let amount = prompt(`${k.name} ने कितना रुपया जमा किया?`, ""); if(amount &&!isNaN(amount) && amount > 0){ k.paymentHistory.push({date: getDateString(new Date()), amount: parseFloat(amount)}); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); } }

function deleteKhata(id){ if(confirm("पक्का चुकता करके Delete करना है?")){ khataData = khataData.filter(x => x.id!= id); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); } }

function printAll(){ window.print(); }

function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center; color:#138808;'>📑 सभी खाते</h2>";
  if(data.length === 0){ list.innerHTML += "<p style='text-align:center;'>अभी कोई खाता नहीं है</p>"; return; }
  data.forEach(k => {
    let h = hisabNikalo(k);
    let photoHtml = k.photo? `<img src="${k.photo}" onclick="window.open('${k.photo}')">` : ""; // क्लिक करने पर बड़ा खुलेगा
    let gramText = k.gram? ` - ${k.gram} ग्राम` : "";
    let locationText = k.location? `<div class="row secret"><span>कहां रखा है:</span><span>${k.location}</span></div>` : "";
    let paymentLog = ""; if(k.paymentHistory && k.paymentHistory.length > 0){ paymentLog = "<div class='payment-log'><b>जमा इतिहास:</b> "; k.paymentHistory.forEach(p => { paymentLog += `₹${p.amount} | `; }) paymentLog += "</div>"; }
    list.innerHTML += `<div class="khata-card">
      <h3>${k.name}</h3>
      ${photoHtml} <!-- फोटो अब ऊपर आ गया -->
      <div class="row"><span>सामान:</span><span>${k.saman}${gramText}</span></div>
      ${locationText}
      <div class="row"><span>समय हुआ:</span><span>${h.months} महीना / ${h.days} दिन</span></div>
      <div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div>
      <div class="row"><span>ब्याज हुआ:</span><span>₹${h.interest.toFixed(2)}</span></div>
      <div class="row"><span>जमा किया:</span><span>₹${h.totalPaid.toFixed(2)}</span></div>
      <div class="row total"><span>बकाया:</span><span>₹${h.total.toFixed(2)}</span></div>
      ${paymentLog}
      ${h.karariStatus?`<div class="danger">${h.karariStatus}</div>`:''}
      <div style="margin-top:8px;">
        <button class="btn-small btn-speak" onclick="bolKeBatao(khataData.find(x=>x.id==${k.id}))">🔊 बोलें</button>
        <button class="btn-small btn-payment" onclick="addPayment(${k.id})">💰 जमा</button>
        <button class="btn-small btn-delete" onclick="deleteKhata(${k.id})">🗑️ चुकता</button>
      </div>
    </div>`;
  });
}
function searchKhata(){ let q = document.getElementById('searchInput').value.toLowerCase(); showKhata(khataData.filter(k => k.name.toLowerCase().includes(q))); }
</script>
</body>
</html>
