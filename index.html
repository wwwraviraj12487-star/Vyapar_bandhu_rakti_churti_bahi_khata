<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - ऑटो बही खाता</title>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7283668314058198" crossorigin="anonymous"></script>
<style>
body { font-family: 'Mangal', Arial; background: #f5f5f5; margin: 0; padding: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 10px; text-align: center; border-bottom: 4px solid #000080; }
.gov-board h1 { margin: 0; font-size: 16px; color: #000080; font-weight: bold; }
.gov-board p { margin: 3px 0 0 0; font-size: 12px; color: #000; font-weight: bold; }

.search-box { background: #fff; padding: 10px; margin: 10px; border-radius: 10px; border: 2px solid #138808; }
.search-box input { width: 100%; padding: 10px; border: 2px solid #ff9800; border-radius: 6px; font-size: 15px; box-sizing: border-box; }

.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 10px; border: 2px solid #ff9800; }
input, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; border: 2px solid #138808; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
.btn-main { width: 100%; padding: 12px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }

.khata-list { margin: 10px; }
.khata-card { background: #fff; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #d32f2f; box-shadow: 0 2px 4px #ccc; }
.khata-card img { width: 100%; max-height: 150px; object-fit: cover; border-radius: 6px; margin: 8px 0; border: 1px solid #ddd; }
.khata-card h3 { margin: 0 0 8px 0; color: #000080; font-size: 15px; }
.row { display: flex; justify-content: space-between; font-size: 13px; padding: 3px 0; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; }
.btn-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.btn-speak { flex:1; background: #ff6600; color:#fff; border:none; padding:8px; border-radius:6px; font-size:12px; min-width: 80px; }
.btn-print { flex:1; background: #000080; color:#fff; border:none; padding:8px; border-radius:6px; font-size:12px; min-width: 80px; }
.delete { background: #d32f2f; }
.churti { background: #2e7d32; }
</style>
</head>
<body>

<div class="gov-board">
  <h1>Vyapar Bandhu ऑटो बही खाता</h1>
  <p>Made in Bihar | 12 महीना साधारण, बाद में चक्रवृद्धि | Indian 🇮🇳</p>
</div>

<!-- SEARCH BAR -->
<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()">
</div>

<div class="calc-box">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label>
  <input type="text" id="custName" placeholder="जैसे राम कुमार">

  <label>पता</label>
  <textarea id="custAddress" rows="2" placeholder="जैसे गाँव, थाना, जिला"></textarea>

  <label>सामान का नाम</label>
  <input type="text" id="samanName" placeholder="जैसे सोना, मोबाइल">

  <label>सामान का फोटो</label>
  <input type="file" id="samanPhoto" accept="image/*">

  <label>उधार की तारीख</label>
  <input type="date" id="udharDate">

  <label>मूलधन ₹</label>
  <input type="number" id="mulDhan" placeholder="10000">

  <label>ब्याज दर % महीना</label>
  <input type="number" id="byajRate" placeholder="2" step="0.1" value="2">

  <button class="btn-main" onclick="khataAdd()">खाता जोड़ें</button>
</div>

<div class="khata-list" id="khataList">
  <h2 style="text-align:center; color:#138808;">📑 सभी खाते</h2>
</div>

<script>
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  showKhata();
  (adsbygoogle = window.adsbygoogle || []).push({});
}

function khataAdd(){
  let name = document.getElementById('custName').value;
  let address = document.getElementById('custAddress').value;
  let saman = document.getElementById('samanName').value;
  let date = document.getElementById('udharDate').value;
  let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value);
  let photoFile = document.getElementById('samanPhoto').files[0];

  if(!name ||!saman ||!date ||!mul){ alert("नाम, सामान, तारीख और मूलधन जरूरी है"); return; }

  if(photoFile){
    let reader = new FileReader();
    reader.onload = function(e){
      saveKhata(name, address, saman, date, mul, rate, e.target.result);
    }
    reader.readAsDataURL(photoFile);
  } else {
    saveKhata(name, address, saman, date, mul, rate, "");
  }
}

function saveKhata(name, address, saman, date, mul, rate, photo){
  khataData.push({id: Date.now(), name, address, saman, date, mul, rate, photo});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  document.getElementById('custName').value = "";
  document.getElementById('custAddress').value = "";
  document.getElementById('samanName').value = "";
  document.getElementById('mulDhan').value = "";
  document.getElementById('samanPhoto').value = "";
  showKhata();
}

function hisabNikalo(khata){
  let startDate = new Date(khata.date);
  let today = new Date();
  let diffTime = today - startDate;
  let diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44;

  let currentAmount = khata.mul;
  let totalInterest = 0;

  if(diffMonths <= 12){
    totalInterest = (khata.mul * khata.rate * diffMonths) / 100;
    currentAmount = khata.mul + totalInterest;
  } else {
    let firstYearInterest = (khata.mul * khata.rate * 12) / 100;
    currentAmount = khata.mul + firstYearInterest;
    let remainingMonths = diffMonths - 12;
    for(let i=0; i<remainingMonths; i++){
      let mahineKaByaj = (currentAmount * khata.rate) / 100;
      currentAmount = currentAmount + mahineKaByaj;
    }
    totalInterest = currentAmount - khata.mul;
  }

  return {
    days: diffDays,
    months: diffMonths.toFixed(1),
    interest: totalInterest,
    total: currentAmount
  };
}

function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center; color:#138808;'>📑 सभी खाते</h2>";
  if(data.length === 0){
    list.innerHTML += "<p style='text-align:center;'>कोई खाता नहीं है</p>";
    return;
  }

  data.forEach(k => {
    let hisab = hisabNikalo(k);
    let photoHtml = k.photo? `<img src="${k.photo}" alt="${k.saman}">` : "";
    let card = `
    <div class="khata-card" id="khata-${k.id}">
      <h3>${k.name}</h3>
      <div class="row"><span>पता:</span><span>${k.address || 'नहीं दिया'}</span></div>
      <div class="row"><span>सामान:</span><span>${k.saman}</span></div>
      ${photoHtml}
      <div class="row"><span>तारीख:</span><span>${k.date}</span></div>
      <div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div>
      <div class="row"><span>ब्याज दर:</span><span>${k.rate}% महीना</span></div>
      <div class="row"><span>कुल समय:</span><span>${hisab.months} महीना</span></div>
      <div class="row"><span>कुल ब्याज:</span><span>₹${hisab.interest.toFixed(2)}</span></div>
      <div class="row total"><span>कुल देना होगा:</span><span>₹${hisab.total.toFixed(2)}</span></div>
      <div class="btn-row">
        <button class="btn-speak" onclick="speakKhata(${k.id})">🔊 सुनें</button>
        <button class="btn-print" onclick="printKhata(${k.id})">🖨️ Print</button>
        <button class="btn-print churti" onclick="churtiKhata(${k.id})">✅ सामान छुड़ गया</button>
        <button class="btn-print delete" onclick="deleteKhata(${k.id})">❌ हटाएं</button>
      </div>
    </div>`;
    list.innerHTML += card;
  });
}

function searchKhata(){
  let query = document.getElementById('searchInput').value.toLowerCase();
  let filtered = khataData.filter(k =>
    k.name.toLowerCase().includes(query) ||
    k.address.toLowerCase().includes(query)
  );
  showKhata(filtered);
}

function churtiKhata(id){
  if(confirm("क्या सामान छुड़ गया है? ये खाता डिलीट हो जाएगा")){
    deleteKhata(id);
    alert("खाता डिलीट कर दिया गया");
  }
}

function speakKhata(id){
  let k = khataData.find(x => x.id === id);
  let hisab = hisabNikalo(k);
  let text = `${k.name}. पता ${k.address}. सामान ${k.saman}. मूलधन ${k.mul} रुपया. ब्याज दर ${k.rate} प्रतिशत महीना. कुल ${hisab.months} महीना हुए. कुल देना होगा ${hisab.total.toFixed(0)} रुपया.`;
  let utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'hi-IN'; utterance.rate = 0.9;
  window.speechSynthesis.speak(utterance);
}

function printKhata(id){
  let k = khataData.find(x => x.id === id);
  let hisab = hisabNikalo(k);
  let photoHtml = k.photo? `<img src="${k.photo}" style="width:200px; margin:10px 0;">` : "";
  let printWindow = window.open('', '', 'height=600,width=400');
  printWindow.document.write(`
    <h2 style="text-align:center;">Vyapar Bandhu रसीद</h2>
    <hr>
    <p><b>नाम:</b> ${k.name}</p>
    <p><b>पता:</b> ${k.address}</p>
    <p><b>सामान:</b> ${k.saman}</p>
    ${photoHtml}
    <p><b>तारीख:</b> ${k.date}</p>
    <p><b>मूलधन:</b> ₹${k.mul.toFixed(2)}</p>
    <p><b>ब्याज दर:</b> ${k.rate}% महीना</p>
    <p><b>कुल समय:</b> ${hisab.months} महीना</p>
    <p><b>कुल ब्याज:</b> ₹${hisab.interest.toFixed(2)}</p>
    <h3><b>कुल देना होगा: ₹${hisab.total.toFixed(2)}</b></h3>
    <hr>
    <p style="text-align:center; font-size:12px;">Made in Bihar | 12 महीना बाद ऑटो चक्रवृद्धि</p>
  `);
  printWindow.document.close();
  printWindow.print();
}

function deleteKhata(id){
  khataData = khataData.filter(x => x.id!== id);
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  showKhata();
}
</script>
</body>
</html>
