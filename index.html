<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
body { font-family: 'Mangal', Arial; background: #f0f8ff; margin: 0; padding: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 12px; text-align: center; border-bottom: 4px solid #000080; }
.today-date { background: #000080; color:#fff; padding:10px; text-align:center; font-weight:bold; font-size:15px; }
.search-box { background: #fff; padding: 12px; margin: 10px; border-radius: 12px; border: 2px solid #138808; }
.search-box input { width: 100%; padding: 12px; border: 2px solid #ff9800; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 12px; border: 2px solid #ff9800; }
.calc-box h2 { margin-top: 0; color: #000080; text-align: center; }
label { font-weight: bold; font-size: 14px; color: #333; }
input, textarea { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 2px solid #138808; border-radius: 6px; font-size: 15px; box-sizing: border-box; }
.btn-main { width: 100%; padding: 14px; background: linear-gradient(90deg, #138808, #0a5f05); color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; cursor: pointer; }
.btn-print { background: linear-gradient(90deg, #000080, #000050); }
.btn-gmail { background: linear-gradient(90deg, #d32f2f, #a00); }
.khata-card { background: #fff; padding: 12px; margin: 10px; border-radius: 10px; border-left: 6px solid #d32f2f; box-shadow: 0 3px 6px #bbb; overflow: hidden; }
.khata-card h3 { margin: 0 0 8px 0; color: #000080; }
.khata-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 2px solid #138808; float: right; margin-left: 10px; cursor: pointer; }
.row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed #eee; clear: both; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; border-bottom: none; }
.danger { font-weight: bold; color: #fff; background: #d32f2f; padding: 4px; border-radius: 4px; text-align: center; margin-top: 5px; clear: both; }
.btn-small { padding: 8px 8px; font-size: 11px; border: none; border-radius: 6px; margin-right: 4px; font-weight: bold; color:#fff; cursor: pointer; }
.btn-speak { background: #ff9800; }
.btn-payment { background: #007bff; }
.btn-delete { background: #555; }
.btn-print-one { background: #138808; }
.btn-mail-one { background: #d32f2f; }
.secret { color: #d32f2f; font-weight: bold; }
.payment-log { background:#e8f5e9; padding:5px; border-radius:5px; margin-top:5px; font-size:12px; clear: both; }
</style>
</head>
<body>

<div class="gov-board">
  <h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
  <p>Made in Bihar | 12 महीना बाद चक्रवृद्धि</p>
</div>
<div class="today-date" id="todayDate">लोड हो रहा है... ⏳</div>

<div class="search-box">
  <input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()">
</div>

<div class="calc-box">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label><input type="text" id="custName" placeholder="जैसे: राम कुमार">
  <label>ग्राहक का Gmail</label><input type="email" id="custEmail" placeholder="जैसे: ram@gmail.com">
  <label>पता</label><textarea id="custAddress" rows="2" placeholder="गांव, थाना, जिला"></textarea>
  <label>सामान का नाम</label><input type="text" id="samanName" placeholder="जैसे: Payal">
  <label>सामान कितना ग्राम</label><input type="number" id="samanGram" placeholder="जैसे: 104">
  <label>सामान कहां रखा है</label><input type="text" id="samanLocation" placeholder="जैसे: तिजोरी में">
  <label>सामान कितने दिन की करारी है</label><input type="number" id="karariDin" placeholder="जैसे: 90">
  <label>सामान का फोटो</label><input type="file" id="samanPhoto" accept="image/*">
  <label>उधार की तारीख</label><input type="date" id="udharDate">
  <div style="color:#138808; font-weight:bold;" id="datePreview">तारीख: </div>
  <label>मूलधन ₹</label><input type="number" id="mulDhan" placeholder="5000">
  <label>ब्याज दर % महीना</label><input type="number" id="byajRate" value="2" step="0.1">

  <button class="btn-main" id="btnAdd">खाता जोड़ें</button>
  <button class="btn-main btn-print" id="btnPrint">📄 पूरा हिसाब प्रिंट करें</button>
  <button class="btn-main btn-gmail" id="btnGmail">📧 सभी को Gmail भेजें</button>
</div>

<div id="khataList"></div>

<script>
const CLIENT_ID = '354482413703-rqism5pdpd3rkgerortbdluu1rjb7gi4.apps.googleusercontent.com';
const SCOPES = 'https://www.googleapis.com/auth/gmail.send';
let tokenClient;
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  document.getElementById('datePreview').innerText = "तारीख: " + getDateString(new Date());
  updateTodayDate();
  showKhata();
  initGoogle();
  gapi.load('client', ()=>{});
  document.getElementById('btnAdd').onclick = khataAdd;
  document.getElementById('btnPrint').onclick = printAll;
  document.getElementById('btnGmail').onclick = sendAllByEmail;
}

function initGoogle(){
  tokenClient = google.accounts.oauth2.initTokenClient({ client_id: CLIENT_ID, scope: SCOPES, callback: '' });
}

function getDateString(gDate){ return new Date(gDate).toLocaleDateString('hi-IN', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' }); }
function updateTodayDate(){ document.getElementById('todayDate').innerText = "आज: " + getDateString(new Date()); }
document.getElementById('udharDate').addEventListener('change', function(){ document.getElementById('datePreview').innerText = "तारीख: " + getDateString(this.value); })

function khataAdd(){
  let name = document.getElementById('custName').value; let email = document.getElementById('custEmail').value; let address = document.getElementById('custAddress').value;
  let saman = document.getElementById('samanName').value; let gram = document.getElementById('samanGram').value; let location = document.getElementById('samanLocation').value;
  let karari = document.getElementById('karariDin').value; let date = document.getElementById('udharDate').value; let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value); let photoFile = document.getElementById('samanPhoto').files[0];
  if(!name ||!saman ||!date ||!mul){ alert("नाम, सामान, तारीख, मूलधन भरना जरूरी है"); return; }
  let engDate = getDateString(date);
  if(photoFile){ let reader = new FileReader(); reader.onload = e => saveKhata(name, email, address, saman, gram, location, karari, date, engDate, mul, rate, e.target.result); reader.readAsDataURL(photoFile); }
  else { saveKhata(name, email, address, saman, gram, location, karari, date, engDate, mul, rate, ""); }
}

// paymentHistory जोड़ दिया
function saveKhata(name, email, address, saman, gram, location, karari, date, engDate, mul, rate, photo){
  khataData.push({id: Date.now(), name, email, address, saman, gram, location, karari, date, engDate, mul, rate, photo, paymentHistory: []});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); alert("खाता सेव हो गया ✅");
  document.querySelectorAll('.calc-box input,.calc-box textarea').forEach(el => el.value = "");
  document.getElementById('udharDate').valueAsDate = new Date(); document.getElementById('byajRate').value = 2;
  document.getElementById('datePreview').innerText = "तारीख: " + getDateString(new Date()); showKhata();
}

// हिसाब + जमा घटाना
function hisabNikalo(khata){
  let startDate = new Date(khata.date); let today = new Date();
  let diffDays = Math.floor((today - startDate) / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44; let currentAmount = khata.mul; let interest = 0;

  if(diffMonths <= 12){
    interest = (khata.mul * khata.rate * diffMonths) / 100;
    currentAmount = khata.mul + interest;
  } else {
    let firstYear = khata.mul + (khata.mul * khata.rate * 12) / 100;
    let remainingMonths = diffMonths - 12; currentAmount = firstYear;
    for(let i=0; i<remainingMonths; i++){ currentAmount = currentAmount + (currentAmount * khata.rate) / 100; }
    interest = currentAmount - khata.mul;
  }

  let totalPaid = 0;
  if(khata.paymentHistory){ khata.paymentHistory.forEach(p => { totalPaid += p.amount; }) }
  currentAmount = currentAmount - totalPaid;
  if(currentAmount < 0) currentAmount = 0;

  let karariStatus = "";
  if(khata.karari){
    if(diffDays > parseInt(khata.karari)){ karariStatus = "⚠️ करारी खत्म! सामान टूट जाएगा"; }
    else { karariStatus = `करारी बाकी: ${parseInt(khata.karari) - diffDays} दिन`; }
  }
  return {total: currentAmount, interest: interest, months: diffMonths.toFixed(1), days: diffDays, karariStatus: karariStatus, totalPaid: totalPaid};
}

// पूरी डिटेल बोलेगा
function bolKeBatao(khata){
  let hisab = hisabNikalo(khata);
  let text = `${khata.name} जी। सामान है ${khata.saman} ${khata.gram? khata.gram + ' ग्राम' : ''}। सामान रखा है ${khata.location || 'पता नहीं'}। ${hisab.months} महीना हुआ। मूलधन ${khata.mul} रुपया। ब्याज ${Math.round(hisab.interest)} रुपया। जमा ${hisab.totalPaid} रुपया। बकाया ${Math.round(hisab.total)} रुपया। ${hisab.karariStatus}`;
  let speech = new SpeechSynthesisUtterance(text); speech.lang = 'hi-IN'; speech.rate = 0.9; window.speechSynthesis.speak(speech);
}

// जमा करने का ऑप्शन
function addPayment(id){
  let k = khataData.find(x => x.id == id);
  let amount = prompt(`${k.name} ने कितना रुपया जमा किया?`, "");
  if(amount &&!isNaN(amount) && amount > 0){
    k.paymentHistory.push({date: getDateString(new Date()), amount: parseFloat(amount)});
    localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
    showKhata();
  }
}

// चुकता करके डिलीट
function deleteKhata(id){
  if(confirm("पक्का चुकता करके Delete करना है?")){
    khataData = khataData.filter(x => x.id!= id);
    localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
    showKhata();
  }
}

function sendMail(to, subject, body){
  tokenClient.callback = async (resp) => {
    if(resp.error){ alert("Login Failed: " + resp.error); return; }
    await gapi.client.load('gmail', 'v1');
    const email = ['Content-Type: text/html; charset="UTF-8"','MIME-Version: 1.0','',`to: ${to}`,`subject: ${subject}`,'',body].join('\n');
    const base64EncodedEmail = btoa(unescape(encodeURIComponent(email))).replace(/\+/g, '-').replace(/\//g, '_');
    await gapi.client.gmail.users.messages.send({'userId': 'me','resource': {'raw': base64EncodedEmail}});
    alert(`${to} को Gmail भेज दिया गया ✅`);
  };
  tokenClient.requestAccessToken({prompt: 'consent'});
}

function generateEmailBody(k){
  let hisab = hisabNikalo(k);
  return `<h2>Vyapar Bandhu - खाता पर्ची</h2><p><b>नाम:</b> ${k.name}</p><p><b>सामान:</b> ${k.saman} ${k.gram} ग्राम</p><p><b>कहां रखा:</b> ${k.location}</p><p><b>महीना:</b> ${hisab.months}</p><p><b>ब्याज:</b> ₹${hisab.interest.toFixed(2)}</p><p><b>जमा:</b> ₹${hisab.totalPaid.toFixed(2)}</p><p><b>कुल देना:</b> ₹${hisab.total.toFixed(2)}</p><p>${hisab.karariStatus}</p>`;
}

function sendOneMail(id){ let k = khataData.find(x => x.id == id); if(!k.email){ alert("पहले ग्राहक का Gmail डालो"); return; } sendMail(k.email, `VyaparBandhu - ${k.name} का हिसाब`, generateEmailBody(k)); }
function sendAllByEmail(){ if(khataData.length === 0){ alert("कोई खाता नहीं है"); return; } khataData.forEach(k => { if(k.email){ sendMail(k.email, `VyaparBandhu - ${k.name} का हिसाब`, generateEmailBody(k)); } }); }

function printOne(id){ let k = khataData.find(x => x.id == id); let hisab = hisabNikalo(k); let printHtml = `<div style="padding:20px;"><h2>${k.name}</h2><p>सामान: ${k.saman}</p><p>कुल देना: ₹${hisab.total.toFixed(2)}</p></div>`; let win = window.open('', '', 'height=800,width=500'); win.document.write('<html><body>' + printHtml + '</body></html>'); win.document.close(); setTimeout(() => { win.print(); }, 250); }
function printAll(){ let printHtml = `<div style="padding:20px;"><h2>पूरा हिसाब</h2>`; khataData.forEach(k => { let hisab = hisabNikalo(k); printHtml += `<p><b>${k.name}</b> - ₹${hisab.total.toFixed(2)}</p>`; }); printHtml += `</div>`; let win = window.open('', '', 'height=800,width=500'); win.document.write('<html><body>' + printHtml + '</body></html>'); win.document.close(); setTimeout(() => { win.print(); }, 250); }

// सब फीचर वाला कार्ड
function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center; color:#138808;'>📑 सभी खाते</h2>";
  if(data.length === 0){ list.innerHTML += "<p style='text-align:center;'>अभी कोई खाता नहीं है</p>"; return; }
  data.forEach(k => {
    let hisab = hisabNikalo(k);
    let photoHtml = k.photo? `<img src="${k.photo}" onclick="window.open('${k.photo}')">` : "";
    let gramText = k.gram? ` - ${k.gram} ग्राम` : "";
    let locationText = k.location? `<div class="row secret"><span>कहां रखा है:</span><span>${k.location}</span></div>` : "";

    let paymentLog = "";
    if(k.paymentHistory && k.paymentHistory.length > 0){
      paymentLog = "<div class='payment-log'><b>जमा इतिहास:</b> ";
      k.paymentHistory.forEach(p => { paymentLog += `₹${p.amount} | `; })
      paymentLog += "</div>";
    }

    list.innerHTML += `<div class="khata-card">
      <h3>${k.name}</h3>
      ${photoHtml}
      <div class="row"><span>सामान:</span><span>${k.saman}${gramText}</span></div>
      ${locationText}
      <div class="row"><span>समय हुआ:</span><span>${hisab.months} महीना / ${hisab.days} दिन</span></div>
      <div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div>
      <div class="row"><span>ब्याज हुआ:</span><span>₹${hisab.interest.toFixed(2)}</span></div>
      <div class="row"><span>जमा किया:</span><span>₹${hisab.totalPaid.toFixed(2)}</span></div>
      <div class="row total"><span>बकाया:</span><span>₹${hisab.total.toFixed(2)}</span></div>
      ${paymentLog}
      ${hisab.karariStatus?`<div class="danger">${hisab.karariStatus}</div>`:''}
      <div style="margin-top:8px;">
        <button class="btn-small btn-speak" onclick="bolKeBatao(khataData.find(x=>x.id==${k.id}))">🔊 बोलें</button>
        <button class="btn-small btn-payment" onclick="addPayment(${k.id})">💰 जमा</button>
        <button class="btn-small btn-delete" onclick="deleteKhata(${k.id})">🗑️ चुकता</button>
        <button class="btn-small btn-print-one" onclick="printOne(${k.id})">🖨️</button>
        <button class="btn-small btn-mail-one" onclick="sendOneMail(${k.id})">📧</button>
      </div>
    </div>`;
  });
}

function searchKhata(){ let query = document.getElementById('searchInput').value.toLowerCase(); let filtered = khataData.filter(k => k.name.toLowerCase().includes(query)); showKhata(filtered); }
</script>
</body>
</html>
