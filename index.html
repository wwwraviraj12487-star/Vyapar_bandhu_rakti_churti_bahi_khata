<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu</title>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body{font-family:Arial;background:#f0f8ff;margin:0}
.gov-board{background:linear-gradient(90deg,#FF9933,#fff,#138808);padding:12px;text-align:center;border-bottom:4px solid #000080}
.today-date{background:#000080;color:#fff;padding:10px;text-align:center;font-weight:bold;font-size:14px}
.trial-tag{background:#000080;color:#fff;padding:6px 12px;border-radius:20px;font-size:13px;display:inline-block;margin-top:5px;font-weight:bold}
.search-box,.calc-box{background:#fff;padding:12px;margin:10px;border-radius:12px;border:2px solid #138808}
.calc-box input,textarea{width:100%;padding:10px;margin:5px 0 12px 0;border:2px solid #138808;border-radius:6px;box-sizing:border-box}
label{display:block;font-weight:bold;margin-top:8px}
.btn-main{width:100%;padding:14px;background:#138808;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold;margin-bottom:8px}
.khata-card{background:#fff;padding:12px;margin:10px;border-radius:10px;border-left:6px solid #d32f2f}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #eee}
#subscriptionOverlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:99999;display:none;justify-content:center;align-items:center;padding:15px;box-sizing:border-box}
.sub-box{background:#fff;border-radius:15px;padding:22px;width:100%;max-width:380px;text-align:center;border:4px solid #FF9933}
.btn-pay{background:#000080;color:#fff;padding:15px;width:100%;border:none;border-radius:10px;font-size:18px;font-weight:bold;margin-top:15px}
</style>
</head>
<body>
<div class="gov-board">
<h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
<p>Made in Bihar | 12 महीना बाद चक्रवृद्धि</p>
<div id="subscriptionStatus" class="trial-tag">Free Trial</div>
</div>
<div class="today-date" id="todayDate">आज: लोड हो रहा है...</div>
<div class="search-box"><input type="text" id="searchInput" placeholder="🔍 नाम खोजें..." onkeyup="searchKhata()"></div>
<div class="calc-box">
<h2>📒 नया खाता जोड़ें</h2>
<label>ग्राहक का नाम</label><input id="custName">
<label>Gmail</label><input id="custEmail">
<label>पता</label><textarea id="custAddress"></textarea>
<label>सामान का नाम</label><input id="samanName">
<label>ग्राम</label><input id="samanGram" type="number">
<label>कहां रखा है</label><input id="samanLocation">
<label>करारी दिन</label><input id="karariDin" type="number">
<label>फोटो</label><input id="samanPhoto" type="file" accept="image/*">
<label>उधार तारीख</label><input id="udharDate" type="date">
<div id="datePreview" style="color:#138808;font-weight:bold"></div>
<label>मूलधन ₹</label><input id="mulDhan" type="number">
<label>ब्याज %</label><input id="byajRate" value="2" type="number">
<button class="btn-main" id="btnAdd">खाता जोड़ें</button>
</div>
<div id="khataList"></div>
<div id="subscriptionOverlay"><div class="sub-box"><div style="font-size:50px">🙏</div><h2 style="color:#d32f2f">मालिक!</h2><p style="font-weight:bold">मालिक मेरा मजदूरी दे दो, घर पे बीवी बाल बच्चे के लिए साग सब्जी ले जाना है</p><p id="subDaysLeft" style="color:#000080;font-weight:bold"></p><button class="btn-pay" onclick="payNow()">💳 ₹99 रिचार्ज करो</button></div></div>
<script>
const RAZORPAY_LIVE_KEY="rzp_live_TSSLcwOZn8V7er";
let khataData=[]; try{ let r=localStorage.getItem('vyaparKhata'); if(r) khataData=JSON.parse(r); }catch(e){}
function speak(t){ try{ let s=new SpeechSynthesisUtterance(t); s.lang='hi-IN'; s.rate=0.85; speechSynthesis.speak(s);}catch(e){} }
function simpleDate(d){ let dt=new Date(d); return dt.getDate()+"/"+(dt.getMonth()+1)+"/"+dt.getFullYear(); }

function checkSub(){
  let now=new Date();
  let todayEl=document.getElementById('todayDate');
  let statusEl=document.getElementById('subscriptionStatus');
  // TODAY DATE - SIMPLE, KABHI FAIL NAHI HOGA
  todayEl.innerText = "आज: " + simpleDate(now) + " | खाते: " + khataData.length;

  let sub=null; try{ sub=JSON.parse(localStorage.getItem('vyapar_subscription')); }catch(e){}
  if(!sub){ sub={trialEnd: now.getTime() + 30*24*60*60*1000, paidTill:null}; localStorage.setItem('vyapar_subscription', JSON.stringify(sub)); }

  let days=0;
  let paidTill = sub.paidTill? sub.paidTill : 0;
  if(paidTill && now.getTime() < paidTill){
    days=Math.ceil((paidTill-now.getTime())/86400000);
    statusEl.innerText="✅ Paid - "+days+" दिन बचा है";
    statusEl.style.background="#138808";
    todayEl.innerText="आज: "+simpleDate(now)+" | ✅ Recharge: "+days+" दिन बचा है";
    document.getElementById('subscriptionOverlay').style.display="none";
    return;
  }
  if(now.getTime() < sub.trialEnd){
    days=Math.ceil((sub.trialEnd-now.getTime())/86400000);
    statusEl.innerText="🎁 Free Trial - "+days+" दिन बचा है";
    statusEl.style.background="#000080";
    todayEl.innerText="आज: "+simpleDate(now)+" | 🎁 Free: "+days+" दिन बचा है";
    document.getElementById('subscriptionOverlay').style.display="none";
    return;
  }
  statusEl.innerText="⚠️ Recharge Khatam";
  statusEl.style.background="#d32f2f";
  todayEl.innerText="आज: "+simpleDate(now)+" | ⚠️ Recharge खत्म";
  document.getElementById('subscriptionOverlay').style.display="flex";
  document.getElementById('subDaysLeft').innerText="0 दिन बचा है";
  speak("मालिक मेरा मजदूरी दे दो, घर पे बीवी बाल बच्चे के लिए साग सब्जी ले जाना है");
}

function payNow(){
  let opt={key:RAZORPAY_LIVE_KEY, amount:9900, currency:"INR", name:"Vyapar Bandhu", description:"1 Mahine ka Recharge",
  handler:function(r){
    let till=new Date().getTime() + 30*24*60*60*1000;
    let sub=JSON.parse(localStorage.getItem('vyapar_subscription')); sub.paidTill=till; sub.isPaid=true;
    localStorage.setItem('vyapar_subscription', JSON.stringify(sub));
    document.getElementById('subscriptionOverlay').style.display="none";
    let t="धन्यवाद मालिक, अब हमारा बाल बच्चा भूखा नहीं रहेगा"; alert(t); speak(t); checkSub();
  }, theme:{color:"#138808"}}; new Razorpay(opt).open();
}

function saveKhata(n,e,a,s,g,l,k,d,m,ra,ph){ khataData.push({id:Date.now(), name:n, email:e, address:a, saman:s, gram:g, location:l, karari:k, date:d, mul:m, rate:ra, photo:ph, paymentHistory:[]}); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); alert("सेव ✅ Total: "+khataData.length); showKhata(); checkSub(); }
function hisab(k){ let diff=Math.floor((new Date()-new Date(k.date))/86400000); let dm=diff/30.44; let cur=k.mul; let intr=0; if(dm<=12){ intr=(k.mul*k.rate*dm)/100; cur+=intr; } else { let fy=k.mul+(k.mul*k.rate*12)/100; cur=fy; for(let i=0;i<dm-12;i++) cur+=(cur*k.rate)/100; intr=cur-k.mul; } let paid=0; if(k.paymentHistory) k.paymentHistory.forEach(p=>paid+=p.amount); cur-=paid; if(cur<0) cur=0; let kar=""; if(k.karari){ kar=diff>k.karari?"⚠️ करारी खत्म":"करारी बाकी: "+(k.karari-diff)+" दिन"; } return {total:cur, interest:intr, months:dm.toFixed(1), days:diff, karari:kar, paid:paid}; }
function showKhata(f){ let data=f||khataData; let list=document.getElementById('khataList'); list.innerHTML="<h2 style='text-align:center;color:#138808'>📑 सभी खाते ("+data.length+")</h2>"; if(!data.length){ list.innerHTML+="<p style='text-align:center'>अभी कोई खाता नहीं</p>"; return; } data.forEach(k=>{ let h=hisab(k); list.innerHTML+="<div class='khata-card'><h3>"+k.name+"</h3><div class='row'><span>सामान:</span><span>"+k.saman+"</span></div><div class='row'><span>बकाया:</span><span>₹"+h.total.toFixed(2)+"</span></div>"+(h.karari?"<div style='background:#d32f2f;color:#fff;padding:4px;text-align:center;border-radius:4px'>"+h.karari+"</div>":"")+"</div>"; }); }
function searchKhata(){ let q=document.getElementById('searchInput').value.toLowerCase(); showKhata(khataData.filter(k=>k.name.toLowerCase().includes(q))); }

// START
document.getElementById('udharDate').valueAsDate=new Date();
document.getElementById('datePreview').innerText="तारीख: "+simpleDate(new Date());
document.getElementById('btnAdd').onclick=function(){
  let n=document.getElementById('custName').value; let s=document.getElementById('samanName').value;
  let d=document.getElementById('udharDate').value; let m=parseFloat(document.getElementById('mulDhan').value);
  if(!n||!s||!d||!m){ alert("नाम, सामान, तारीख, मूलधन जरूरी"); return; }
  let f=document.getElementById('samanPhoto').files[0];
  if(f){ let r=new FileReader(); r.onload=e=>saveKhata(n,document.getElementById('custEmail').value,document.getElementById('custAddress').value,s,document.getElementById('samanGram').value,document.getElementById('samanLocation').value,document.getElementById('karariDin').value,d,m,parseFloat(document.getElementById('byajRate').value),e.target.result); r.readAsDataURL(f); }
  else saveKhata(n,document.getElementById('custEmail').value,document.getElementById('custAddress').value,s,document.getElementById('samanGram').value,document.getElementById('samanLocation').value,document.getElementById('karariDin').value,d,m,parseFloat(document.getElementById('byajRate').value),"");
};
checkSub(); showKhata();
document.getElementById('udharDate').addEventListener('change', function(){ document.getElementById('datePreview').innerText="तारीख: "+simpleDate(this.value); });
</script>
</body>
</html>
