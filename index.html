<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="theme-color" content="#138808">

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<style>
body { font-family: Arial; background: #f0f8ff; margin: 0; font-size: 14px; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 12px; text-align: center; border-bottom: 4px solid #000080; }
.today-date { background: #000080; color:#fff; padding:10px; text-align:center; font-weight:bold; font-size:14px; }
.trial-tag { background: #000080; color: #fff; padding: 6px 12px; border-radius: 20px; font-size: 13px; display: inline-block; margin-top:5px; font-weight:bold; }
.search-box,.calc-box { background: #fff; padding: 12px; margin: 10px; border-radius: 12px; border: 2px solid #138808; }
.calc-box input, textarea { width: 100%; padding: 10px; margin: 5px 0 12px 0; border: 2px solid #138808; border-radius: 6px; box-sizing: border-box; }
label { font-weight: bold; display:block; margin-top:8px; }
.btn-main { width: 100%; padding: 14px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
.khata-card { background: #fff; padding: 12px; margin: 10px; border-radius: 10px; border-left: 6px solid #d32f2f; box-shadow: 0 3px 6px #bbb; overflow: hidden; }
.khata-card img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; border: 2px solid #138808; float: right; margin-left: 10px; }
.row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #eee; clear: both; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; }
.danger { background: #d32f2f; color: #fff; padding: 4px; border-radius: 4px; text-align: center; }
.btn-small { padding: 8px; font-size: 11px; border: none; border-radius: 6px; margin-right: 4px; color: #fff; font-weight: bold; }
.btn-speak { background: #ff9800; }.btn-payment { background: #007bff; }.btn-delete { background: #555; }.btn-print-one { background: #138808; }.btn-mail-one { background: #d32f2f; }
#subscriptionOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.92); z-index: 99999; display: none; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
.sub-box { background: #fff; border-radius: 15px; padding: 22px; width: 100%; max-width: 380px; text-align: center; border: 4px solid #FF9933; }
.btn-pay { background: #000080; color: #fff; padding: 15px; width: 100%; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top:15px; }
</style>
</head>
<body>
<div class="gov-board">
<h1>Vyapar Bandhu - 100% शुद्ध बही खाता</h1>
<p>Made in Bihar | 12 महीना बाद चक्रवृद्धि</p>
<div id="subscriptionStatus" class="trial-tag">🎁 Free Trial</div>
</div>
<div class="today-date" id="todayDate">आज: लोड हो रहा है...</div>
<script>
try{
  var d = new Date();
  document.getElementById('todayDate').innerText = "आज: " + d.getDate() + "/" + (d.getMonth()+1) + "/" + d.getFullYear() + " | लोड हो रहा...";
  document.getElementById('subscriptionStatus').innerText = "🎁 Free Trial - 30 दिन बचा है";
}catch(e){
  document.getElementById('todayDate').innerText = "आज: " + new Date().toDateString();
}
</script>
<div class="search-box"><input type="text" id="searchInput" placeholder="🔍 नाम या पता लिखकर खोजें..." onkeyup="searchKhata()"></div>
<div class="calc-box">
<h2>📒 नया खाता जोड़ें</h2>
<label>ग्राहक का नाम</label><input id="custName" placeholder="जैसे: राम कुमार">
<label>Gmail</label><input id="custEmail" placeholder="जैसे: ram@gmail.com">
<label>पता</label><textarea id="custAddress" placeholder="गांव, थाना, जिला"></textarea>
<label>सामान का नाम</label><input id="samanName" placeholder="जैसे: Payal">
<label>सामान कितना ग्राम</label><input id="samanGram" type="number" placeholder="104">
<label>सामान कहां रखा है</label><input id="samanLocation" placeholder="जैसे: तिजोरी में">
<label>सामान कितने दिन की करारी है</label><input id="karariDin" type="number" placeholder="90">
<label>सामान का फोटो</label><input id="samanPhoto" type="file" accept="image/*">
<label>उधार की तारीख</label><input id="udharDate" type="date">
<div id="datePreview" style="color:#138808;font-weight:bold"></div>
<label>मूलधन ₹</label><input id="mulDhan" type="number" placeholder="5000">
<label>ब्याज दर % महीना</label><input id="byajRate" value="2" type="number">
<button class="btn-main" id="btnAdd">खाता जोड़ें</button>
<button class="btn-main" style="background:#000080" id="btnPrint">📄 पूरा हिसाब प्रिंट करें</button>
<button class="btn-main" style="background:#d32f2f" id="btnGmail">📧 सभी को Gmail भेजें</button>
</div>
<div id="khataList"></div>
<div id="subscriptionOverlay"><div class="sub-box"><div style="font-size:50px">🙏</div><h2 style="color:#d32f2f">मालिक!</h2><p style="font-weight:bold">मालिक मेरा मजदूरी दे दो, घर पे बीवी बाल बच्चे के लिए साग सब्जी ले जाना है</p><p id="subDaysLeft" style="color:#000080;font-weight:bold"></p><button class="btn-pay" onclick="payNow()">💳 ₹99 रिचार्ज करो</button></div></div>
<script>
const RAZORPAY_LIVE_KEY = "rzp_live_TSSLcwOZn8V7er";
let khataData=[];
try{ let r=localStorage.getItem('vyaparKhata'); if(r && r.length>2) khataData=JSON.parse(r); }catch(e){ localStorage.removeItem('vyaparKhata'); khataData=[]; }
function sDate(d){ try{ let dt=new Date(d); return dt.getDate()+"/"+(dt.getMonth()+1)+"/"+dt.getFullYear(); }catch(e){ return new Date().toDateString(); } }
function speak(t){ try{ let s=new SpeechSynthesisUtterance(t); s.lang='hi-IN'; s.rate=0.85; speechSynthesis.speak(s); }catch(e){} }
function checkSub(){
  try{
    let now=new Date(); let statusEl=document.getElementById('subscriptionStatus'); let todayEl=document.getElementById('todayDate');
    let sub=null; try{ sub=JSON.parse(localStorage.getItem('vyapar_subscription')); }catch(e){ localStorage.removeItem('vyapar_subscription'); sub=null; }
    if(!sub ||!sub.trialEnd){ sub={trialEnd: now.getTime()+30*86400000, paidTill:null}; localStorage.setItem('vyapar_subscription', JSON.stringify(sub)); }
    if(sub.paidTill && now.getTime() < sub.paidTill){
      let days=Math.ceil((sub.paidTill-now.getTime())/86400000);
      statusEl.innerText="✅ Paid - "+days+" दिन बचा है"; statusEl.style.background="#138808";
      todayEl.innerText="आज: "+sDate(now)+" | ✅ Recharge: "+days+" दिन बचा है | खाते: "+khataData.length;
      document.getElementById('subscriptionOverlay').style.display="none"; return;
    }
    if(now.getTime() < sub.trialEnd){
      let days=Math.ceil((sub.trialEnd-now.getTime())/86400000);
      statusEl.innerText="🎁 Free Trial - "+days+" दिन बचा है"; statusEl.style.background="#000080";
      todayEl.innerText="आज: "+sDate(now)+" | 🎁 Free: "+days+" दिन बचा है | खाते: "+khataData.length;
      document.getElementById('subscriptionOverlay').style.display="none"; return;
    }
    statusEl.innerText="⚠️ Recharge Khatam"; statusEl.style.background="#d32f2f";
    todayEl.innerText="आज: "+sDate(now)+" | ⚠️ Recharge खत्म";
    document.getElementById('subscriptionOverlay').style.display="flex";
    document.getElementById('subDaysLeft').innerText="0 दिन बचा है";
    speak("मालिक मेरा मजदूरी दे दो, घर पे बीवी बाल बच्चे के लिए साग सब्जी ले जाना है");
  }catch(e){
    document.getElementById('todayDate').innerText="आज: "+new Date().getDate()+"/"+(new Date().getMonth()+1)+"/"+new Date().getFullYear()+" | खाते: "+khataData.length;
    document.getElementById('subscriptionStatus').innerText="🎁 Free Trial - 30 दिन बचा है";
  }
}
function payNow(){ let opt={key:RAZORPAY_LIVE_KEY, amount:9900, currency:"INR", name:"Vyapar Bandhu", description:"₹99 Recharge", handler:function(r){ let till=new Date().getTime()+30*86400000; let sub=JSON.parse(localStorage.getItem('vyapar_subscription')); sub.paidTill=till; sub.isPaid=true; localStorage.setItem('vyapar_subscription', JSON.stringify(sub)); document.getElementById('subscriptionOverlay').style.display="none"; let t="धन्यवाद मालिक, अब हमारा बाल बच्चा भूखा नहीं रहेगा"; alert(t); speak(t); checkSub(); }, theme:{color:"#138808"}}; new Razorpay(opt).open(); }
function saveKhata(n,e,a,s,g,l,k,d,m,ra,ph){ khataData.push({id:Date.now(), name:n, email:e, address:a, saman:s, gram:g, location:l, karari:k, date:d, mul:m, rate:ra, photo:ph, paymentHistory:[]}); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); alert("सेव हो गया ✅"); showKhata(); checkSub(); }
function hisab(k){ let diff=Math.floor((new Date()-new Date(k.date))/86400000); let dm=diff/30.44; let cur=k.mul; let intr=0; if(dm<=12){ intr=(k.mul*k.rate*dm)/100; cur+=intr; } else { let fy=k.mul+(k.mul*k.rate*12)/100; cur=fy; for(let i=0;i<dm-12;i++) cur+=(cur*k.rate)/100; intr=cur-k.mul; } let paid=0; if(k.paymentHistory) k.paymentHistory.forEach(p=>paid+=p.amount); cur-=paid; if(cur<0) cur=0; let kar=""; if(k.karari){ kar=diff>parseInt(k.karari)?"⚠️ करारी खत्म! सामान टूट गया":"करारी बाकी: "+(parseInt(k.karari)-diff)+" दिन"; } return {total:cur, interest:intr, months:dm.toFixed(1), days:diff, karari:kar, paid:paid}; }
function showKhata(f){ let data=f||khataData; let list=document.getElementById('khataList'); list.innerHTML="<h2 style='text-align:center;color:#138808'>📑 सभी खाते ("+data.length+")</h2>"; if(!data.length){ list.innerHTML+="<p style='text-align:center'>अभी कोई खाता नहीं</p>"; return; } data.forEach(k=>{ let h=hisab(k); let photo=k.photo?`<img src="${k.photo}" onclick="window.open('${k.photo}')">`:""; let gram=k.gram?` - ${k.gram} ग्राम`:""; let loc=k.location?`<div class="row" style="color:#d32f2f;font-weight:bold"><span>कहां रखा है:</span><span>${k.location}</span></div>`:""; let pay=""; if(k.paymentHistory&&k.paymentHistory.length){ pay="<div style='background:#e8f5e9;padding:5px;border-radius:5px;margin-top:5px;font-size:12px'><b>जमा:</b> "; k.paymentHistory.forEach(p=>pay+=`₹${p.amount} | `); pay+="</div>"; } list.innerHTML+=`<div class="khata-card"><h3 style="color:#000080;margin:0 0 8px 0">${k.name}</h3>${photo}<div class="row"><span>सामान:</span><span>${k.saman}${gram}</span></div>${loc}<div class="row"><span>समय हुआ:</span><span>${h.months} महीना / ${h.days} दिन</span></div><div class="row"><span>मूलधन:</span><span>₹${k.mul.toFixed(2)}</span></div><div class="row"><span>ब्याज हुआ:</span><span>₹${h.interest.toFixed(2)}</span></div><div class="row"><span>जमा किया:</span><span>₹${h.paid.toFixed(2)}</span></div><div class="row total"><span>बकाया:</span><span>₹${h.total.toFixed(2)}</span></div>${pay}${h.karari?`<div class="danger">${h.karari}</div>`:''}<div style="margin-top:8px"><button class="btn-small btn-speak" onclick="bolKeBatao(khataData.find(x=>x.id==${k.id}))">🔊 बोलें</button><button class="btn-small btn-payment" onclick="addPayment(${k.id})">💰 जमा</button><button class="btn-small btn-delete" onclick="deleteKhata(${k.id})">🗑️ चुकता</button><button class="btn-small btn-print-one" onclick="printOne(${k.id})">🖨️</button><button class="btn-small btn-mail-one" onclick="sendOneMail(${k.id})">📧</button></div></div>`; }); }
function bolKeBatao(k){ let h=hisab(k); let t=`${k.name} जी। सामान है ${k.saman} ${k.gram?k.gram+' ग्राम':''}। रखा है ${k.location||'पता नहीं'}। ${h.months} महीना हुआ। मूलधन ${k.mul} रुपया। ब्याज ${Math.round(h.interest)} रुपया। जमा ${h.paid} रुपया। बकाया ${Math.round(h.total)} रुपया। ${h.karari}`; let s=new SpeechSynthesisUtterance(t); s.lang='hi-IN'; s.rate=0.9; speechSynthesis.speak(s); }
function addPayment(id){ let k=khataData.find(x=>x.id==id); let a=prompt(k.name+" ने कितना जमा किया?",""); if(a>0){ k.paymentHistory.push({amount:parseFloat(a)}); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); } }
function deleteKhata(id){ if(confirm("Delete?")){ khataData=khataData.filter(x=>x.id!=id); localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata(); checkSub(); } }
function printOne(id){ let k=khataData.find(x=>x.id==id); let h=hisab(k); let w=window.open('','','width=500'); w.document.write(`<h2>${k.name}</h2><p>${k.saman}</p><p>₹${h.total.toFixed(2)}</p>`); w.print(); }
function printAll(){ let w=window.open('','','width=500'); let ht="<h2>पूरा हिसाब</h2>"; khataData.forEach(k=>{ let h=hisab(k); ht+=`<p>${k.name} - ₹${h.total.toFixed(2)}</p>`; }); w.document.write(ht); w.print(); }
function searchKhata(){ let q=document.getElementById('searchInput').value.toLowerCase(); showKhata(khataData.filter(k=>k.name.toLowerCase().includes(q))); }
document.getElementById('udharDate').valueAsDate=new Date();
document.getElementById('datePreview').innerText="तारीख: "+sDate(new Date());
document.getElementById('btnAdd').onclick=function(){ let n=document.getElementById('custName').value; let s=document.getElementById('samanName').value; let d=document.getElementById('udharDate').value; let m=parseFloat(document.getElementById('mulDhan').value); if(!n||!s||!d||!m){ alert("नाम, सामान, तारीख, मूलधन जरूरी"); return; } let f=document.getElementById('samanPhoto').files[0]; if(f){ let r=new FileReader(); r.onload=e=>saveKhata(n,document.getElementById('custEmail').value,document.getElementById('custAddress').value,s,document.getElementById('samanGram').value,document.getElementById('samanLocation').value,document.getElementById('karariDin').value,d,m,parseFloat(document.getElementById('byajRate').value),e.target.result); r.readAsDataURL(f); } else saveKhata(n,document.getElementById('custEmail').value,document.getElementById('custAddress').value,s,document.getElementById('samanGram').value,document.getElementById('samanLocation').value,document.getElementById('karariDin').value,d,m,parseFloat(document.getElementById('byajRate').value),""); };
document.getElementById('btnPrint').onclick=printAll;
checkSub(); showKhata();
</script>
</body>
</html>
