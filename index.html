<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vyapar Bandhu - 100% शुद्ध बही खाता</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>
<style>
body { font-family: 'Mangal', Arial; background: #f0f8ff; margin: 0; padding: 0; }
.gov-board { background: linear-gradient(90deg, #FF9933, #FFFFFF, #138808); padding: 12px; text-align: center; border-bottom: 4px solid #000080; }
.today-date { background: #000080; color:#fff; padding:10px; text-align:center; font-weight:bold; }
.calc-box { background: #fff; padding: 15px; margin: 10px; border-radius: 12px; border: 2px solid #ff9800; }
.btn-main { width: 100%; padding: 14px; background: #138808; color: #fff; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; margin-bottom: 8px; }
.khata-card { background: #fff; padding: 12px; margin: 10px; border-radius: 10px; border-left: 6px solid #d32f2f; }
.row { display: flex; justify-content: space-between; font-size: 13px; padding: 4px 0; }
.total { font-weight: bold; color: #d32f2f; font-size: 16px; }
.btn-small { padding: 7px 10px; font-size: 11px; border: none; border-radius: 6px; margin-right: 4px; font-weight: bold; color:#fff; }
.btn-payment { background: #007bff; }
.btn-delete { background: #555; }
.payment-log { background:#e8f5e9; padding:5px; border-radius:5px; margin-top:5px; font-size:12px; }
</style>
</head>
<body>

<div class="gov-board"><h1>Vyapar Bandhu - 12 महीने बाद चक्रवृद्धि</h1></div>
<div class="today-date" id="todayDate"></div>

<div class="calc-box">
  <h2>📒 नया खाता जोड़ें</h2>
  <label>ग्राहक का नाम</label><input type="text" id="custName">
  <label>उधार की तारीख</label><input type="date" id="udharDate">
  <label>मूलधन ₹</label><input type="number" id="mulDhan">
  <label>ब्याज दर % महीना</label><input type="number" id="byajRate" value="2" step="0.1">
  <button class="btn-main" id="btnAdd">खाता जोड़ें</button>
</div>

<div id="khataList"></div>

<script>
let khataData = JSON.parse(localStorage.getItem('vyaparKhata')) || [];

window.onload = function(){
  document.getElementById('udharDate').valueAsDate = new Date();
  updateTodayDate();
  showKhata();
  document.getElementById('btnAdd').onclick = khataAdd;
}

function getDateString(gDate){ return new Date(gDate).toLocaleDateString('hi-IN'); }
function updateTodayDate(){ document.getElementById('todayDate').innerText = "आज: " + getDateString(new Date()); }

function khataAdd(){
  let name = document.getElementById('custName').value;
  let date = document.getElementById('udharDate').value;
  let mul = parseFloat(document.getElementById('mulDhan').value);
  let rate = parseFloat(document.getElementById('byajRate').value);
  if(!name ||!date ||!mul){ alert("सब भरना जरूरी है"); return; }
  khataData.push({id: Date.now(), name, date, mul, rate, paymentHistory: []});
  localStorage.setItem('vyaparKhata', JSON.stringify(khataData));
  alert("खाता सेव हो गया ✅"); showKhata();
}

// ✅ यही चक्रवृद्धि वाला फंक्शन है
function hisabNikalo(khata){
  let diffDays = Math.floor((new Date() - new Date(khata.date)) / (1000 * 60 * 60 * 24));
  let diffMonths = diffDays / 30.44; 
  let currentAmount = khata.mul;

  if(diffMonths <= 12){
    // 12 महीने तक साधारण ब्याज
    currentAmount = khata.mul + (khata.mul * khata.rate * diffMonths) / 100;
  } else {
    // 12 महीने बाद चक्रवृद्धि
    let firstYearAmount = khata.mul + (khata.mul * khata.rate * 12) / 100;
    let remainingMonths = diffMonths - 12;
    currentAmount = firstYearAmount;
    for(let i=0; i<remainingMonths; i++){
      currentAmount = currentAmount + (currentAmount * khata.rate) / 100; // चक्रवृद्धि
    }
  }
  
  let totalPaid = 0;
  if(khata.paymentHistory){ khata.paymentHistory.forEach(p => { totalPaid += p.amount; }) }
  currentAmount = currentAmount - totalPaid;
  if(currentAmount < 0) currentAmount = 0;
  
  return {total: currentAmount, months: diffMonths.toFixed(1), totalPaid: totalPaid};
}

function deleteKhata(id){
  if(confirm("पक्का चुकता करके Delete करना है?")){
    khataData = khataData.filter(x => x.id != id);
    localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata();
  }
}

function addPayment(id){
  let k = khataData.find(x => x.id == id);
  let amount = prompt(`${k.name} ने कितना रुपया जमा किया?`, "");
  if(amount && !isNaN(amount) && amount > 0){
    k.paymentHistory.push({date: getDateString(new Date()), amount: parseFloat(amount)});
    localStorage.setItem('vyaparKhata', JSON.stringify(khataData)); showKhata();
  }
}

function showKhata(data = khataData){
  let list = document.getElementById('khataList');
  list.innerHTML = "<h2 style='text-align:center;'>📑 सभी खाते</h2>";
  data.forEach(k => {
    let h = hisabNikalo(k);
    let paymentLog = "";
    if(k.paymentHistory && k.paymentHistory.length > 0){
      paymentLog = "<div class='payment-log'><b>जमा:</b> ";
      k.paymentHistory.forEach(p => { paymentLog += `₹${p.amount} | `; })
      paymentLog += "</div>";
    }
    
    list.innerHTML += `
    <div class="khata-card">
      <h3>${k.name}</h3>
      <div class="row"><span>समय:</span><span>${h.months} महीना</span></div>
      <div class="row"><span>जमा किया:</span><span>₹${h.totalPaid.toFixed(2)}</span></div>
      <div class="row total"><span>बकाया:</span><span>₹${h.total.toFixed(2)}</span></div>
      ${paymentLog}
      <div style="margin-top:8px;">
        <button class="btn-small btn-payment" onclick="addPayment(${k.id})">💰 जमा</button>
        <button class="btn-small btn-delete" onclick="deleteKhata(${k.id})">🗑️ चुकता</button>
      </div>
    </div>`;
  });
}
</script>
</body>
</html>
